        设备不存在或不属于当前用户均返回 40400，不区分两者。按用户限流，60s 内最多 3 次
        （42900，带 Retry-After）。当前设备请使用 POST /auth/logout。
      operationId: userLogoutDevice
      tags:
        - Devices
      parameters:
        - name: id
          in: path
          description: 设备 ID（token family_id，UUID）
          required: true
          example: 6da1d5dd-02ec-4fc6-840e-67dc0dae52ac
          schema:
            type: string
      responses:
        "200":
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLogoutResponse"
