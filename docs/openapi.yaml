        "401":
          $ref: "#/components/responses/Unauthorized"
          description: 未认证（401xx）
        "403":
          $ref: "#/components/responses/Forbidden"
          description: 无权限（403xx）
      security:
        - bearerAuth: []
  /admin/stats:
    get:
      summary: 统计概览
      deprecated: false
      description: |
        控制台概览页的一次性数据源，聚合账户、客户端与最近审计三条视图。
        需 admin 角色。

        users 或 clients 聚合失败返回 500；audit.recent 读取失败静默返回
        空列表（best-effort），不影响其余两路。
      operationId: adminStats
      tags:
        - Admin
      parameters: []
      responses:
        "200":
          description: 统计概览
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          users:
                            $ref: "#/components/schemas/UserStats"
                          clients:
                            type: object
                            properties:
                              total:
                                type: integer
                                description: 客户端注册总数（含停用）
                              active:
                                type: integer
                                description: 启用中的客户端数
                          audit:
                            type: object
                            properties:
                              recent:
                                type: array
                                description: 最近 5 条审计日志（读取失败时为空列表）
                                items:
                                  $ref: "#/components/schemas/AuditLog"
          headers: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
          description: 未认证（401xx）
        "403":
          $ref: "#/components/responses/Forbidden"
          description: 无权限（403xx）
        "500":
          description: 服务器内部错误（50000）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardEnvelope"
          headers: {}
      security:
        - bearerAuth: []
  /health:
    get:
      summary: 健康检查
      deprecated: false
      description: ""
      operationId: healthCheck
      tags:
        - Health
      parameters: []
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          headers: {}
      security: []
components:
  schemas:
    UserRole:
      type: string
      enum:
        - freshman
        - member
        - lecturer
        - admin
      description: 用户角色 — freshman（大一新生）/ member（正式成员）/ lecturer（讲师）/ admin（管理员）
    OAuthScope:
      type: string
      enum:
        - openid
        - profile
        - email
      description: OAuth 2.1 授权范围 — openid（用户标识，必选）/ profile（个人资料）/ email（邮箱）
    UserState:
      type: string
      enum:
        - njupter
        - on_sast
        - retired_sast
        - is_deleted
      description: 用户状态 — njupter（在校未加入）/ on_sast（现任成员）/ retired_sast（已离开）/ is_deleted（已注销）
    Department:
      type: string
      enum:
        - software
        - media
      description: 部门 — software（软件部）/ media（媒体部）
    UserStats:
      type: object
      description: 账户聚合统计（admin 概览）
      properties:
        total:
          type: integer
          description: 未注销账户总数（state ≠ is_deleted；已注销的见 by_state.is_deleted）
        by_role:
          type: object
          description: 按角色分组计数（freshman / member / lecturer / admin），不含已注销账户
          additionalProperties:
            type: integer
        by_state:
          type: object
          description: 按状态分组计数（njupter / on_sast / retired_sast / is_deleted），含 is_deleted
          additionalProperties:
            type: integer
        by_department:
          type: object
          description: |
            按部门分组计数（software / media），来自 profile 表 LEFT JOIN，
            不含已注销账户；no_department 之外的用户都有部门
          additionalProperties:
            type: integer
        no_department:
          type: integer
          description: 没有 profile 行或部门未设的未注销用户数
    EmailType:
      type: string
      enum:
        - njupt_email
        - sast_email
      description: 注册邮箱类型 — njupt_email（@njupt.edu.cn）/ sast_email（@sast.fun）
    LoginMethod:
      type: string
      enum:
        - github
        - lark
        - other_mail
      description: 第三方登录方式
    ClientType:
      type: string
      enum:
        - first_party
        - third_party
      description: OAuth 客户端类型 — first_party（SAST 内部应用）/ third_party（外部接入应用）
    College:
      type: string
      enum:
        - 贝尔英才学院
        - 通信与信息工程学院
        - 电光柔学院
        - 集成电路科学与工程学院（产教融合学院）
        - 计算机学院、软件学院、网络空间安全学院
        - 自动化学院
        - 人工智能学院
        - 材料科学与工程学院
        - 化学与生命科学学院
        - 物联网学院
        - 理学院
        - 现代邮政学院、智慧交通学院
        - 数字媒体与设计艺术学院
        - 管理学院
        - 经济学院
        - 社会与人口学院、社会工作学院
        - 外国语学院
