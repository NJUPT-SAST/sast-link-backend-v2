            type: string
      responses:
        "200":
          description: |
            分页用户列表。不带 state 筛选时包含已注销用户（state = is_deleted），
            否则无法找到并恢复它们。department 走 profile 的 LEFT JOIN，
            因此无 profile 行的用户仍会出现，department 为 null。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersListResponse"
          headers: {}
        "400":
          $ref: "#/components/responses/BadRequest"
          description: 分页参数或枚举筛选值非法（400xx）
        "401":
          $ref: "#/components/responses/Unauthorized"
          description: 未认证（401xx）
        "403":
          $ref: "#/components/responses/Forbidden"
          description: 无权限（403xx）
      security:
        - bearerAuth: []
  /admin/users/{id}:
    get:
      summary: 用户详情
      deprecated: false
      description: 需 admin 或 lecturer 角色。
      operationId: adminGetUserDetail
      tags:
        - Admin
      parameters:
        - name: id
          in: path
          description: 用户 ID
          required: true
          example: 0
          schema:
            type: integer
      responses:
        "200":
          description: 用户详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
          headers: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
          description: 未认证（401xx）
        "403":
          $ref: "#/components/responses/Forbidden"
          description: 无权限（403xx）
        "404":
          $ref: "#/components/responses/NotFound"
          description: 资源不存在（404xx）
      security:
        - bearerAuth: []
    put:
      summary: 更新用户
      deprecated: false
      description: 需 admin 角色。
      operationId: adminUpdateUser
      tags:
        - Admin
      parameters:
        - name: id
          in: path
          description: 用户 ID
          required: true
          example: 0
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              description: |
                至少传一个字段。未知字段（含 password、token_version、id、profile）
                返回 400 而非静默忽略。长度按 V001 列宽校验，中文按字符数计。
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: 真实姓名（列为 NOT NULL，不可传空串）
                phone_number:
                  type: string
                  minLength: 1
                  maxLength: 20
                  description: 手机号（不可传空串）
                qq_number:
                  type: string
                  minLength: 1
                  maxLength: 20
                  description: QQ 号（不可传空串）
                college:
                  $ref: "#/components/schemas/College"
                  description: 学院
                major:
                  type: string
                  maxLength: 50
                  description: 专业（可置为空串）
                student_id:
                  type: string
                  minLength: 1
                  maxLength: 50
                  description: 学号（不可传空串）
                role:
                  $ref: "#/components/schemas/UserRole"
                  description: |
                    用户角色。实际发生变化时同一事务内递增 token_version 并撤销该用户全部 Token。
                    不可修改自己的 role，也不可降权系统中最后一名活跃管理员（均 403）。
                state:
                  $ref: "#/components/schemas/UserState"
                  description: |
                    用户状态。仅接受 njupter / on_sast / retired_sast，三者之间可任意修改以供纠错。
                    不接受 is_deleted（422）——注销必须走 DELETE，它才会在同一事务内撤销 Token。
                    对已注销用户调用本接口同样返回 422，需先恢复。
                email_type:
                  $ref: "#/components/schemas/EmailType"
                  description: |
                    注册邮箱类型。只能与 login_email 一同提交且必须与其域名一致，否则 400：
                    触发器 auto_set_email_type 仅在 login_email 出现在 UPDATE 列中时才重算该字段，
                    单独提交会写入与邮箱矛盾的值。
                login_email:
                  type: string
                  format: email
                  maxLength: 255
                  description: |
                    登录邮箱。域名限 @njupt.edu.cn / @sast.fun，会被规范化为小写；
                    修改后触发器 auto_set_email_type 自动重算 email_type。
        required: true
      responses:
        "200":
          description: |
            更新成功。role 实际变化时 message 为
            「用户信息更新成功，已撤销该用户的全部 Token」。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          headers: {}
        "400":
          $ref: "#/components/responses/BadRequest"
          description: 字段校验失败、未知字段或无可更新字段（400xx）
        "401":
          $ref: "#/components/responses/Unauthorized"
          description: 未认证（401xx）
        "403":
          $ref: "#/components/responses/Forbidden"
          description: 无权限，或改自己的 role / 降权最后一名管理员（403xx）
        "404":
          $ref: "#/components/responses/NotFound"
          description: 资源不存在（404xx）
        "409":
          $ref: "#/components/responses/Conflict"
          description: 学号或邮箱已被占用（40901 / 40902）
        "422":
          $ref: "#/components/responses/Unprocessable"
          description: state 为 is_deleted，或目标用户已注销（42200）
      security:
        - bearerAuth: []
    delete:
      summary: 注销用户（软删除）
      deprecated: false
      description: |
        需 admin 角色。将 user.state 设为 is_deleted，保留数据；同一事务内递增
        token_version 并撤销该用户全部 Access / Refresh Token（应用层逐个撤销，
        非 DB 级联删除），撤销的 JTI 写入 outbox，由 worker 失效对应 auth-state 缓存。

        不可注销自己的账号，也不可注销系统中最后一名活跃管理员（均 403）。
      operationId: adminDeleteUser
      tags:
        - Admin
      parameters:
        - name: id
          in: path
          description: 用户 ID
          required: true
          example: 0
          schema:
            type: integer
      responses:
        "200":
          description: 注销成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          headers: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
          description: 未认证（401xx）
        "403":
          $ref: "#/components/responses/Forbidden"
          description: 无权限，或注销自己 / 最后一名管理员（403xx）
        "404":
          $ref: "#/components/responses/NotFound"
          description: 资源不存在（404xx）
        "422":
          $ref: "#/components/responses/Unprocessable"
          description: 用户已注销（42200）
      security:
        - bearerAuth: []
  /admin/users/{id}/restore:
    put:
      summary: 恢复已注销用户
      deprecated: false
      description: |
        需 admin 角色。将 user.state 从 is_deleted 恢复至 njupter。不记忆注销前的状态 ——
        原 on_sast 成员恢复后为 njupter，需管理员另行调整。已撤销的 token 不恢复，
        用户需重新登录。
      operationId: adminRestoreUser
      tags:
        - Admin
      parameters:
        - name: id
          in: path
          description: 用户 ID
          required: true
          example: 0
          schema:
            type: integer
      responses:
        "200":
          description: 恢复成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          headers: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
          description: 未认证（401xx）
        "403":
          $ref: "#/components/responses/Forbidden"
          description: 无权限（403xx）
        "404":
          $ref: "#/components/responses/NotFound"
          description: 资源不存在（404xx）
        "422":
          $ref: "#/components/responses/Unprocessable"
          description: 用户未被注销，无需恢复（42200）
      security:
        - bearerAuth: []
  /admin/oauth-clients:
    get:
      summary: OAuth 客户端列表
      deprecated: false
      description: 需 admin 角色。
      operationId: adminListOAuthClients
      tags:
        - Admin
      parameters: []
      responses:
        "200":
          description: 客户端列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOAuthClientsListResponse"
          headers: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
          description: 未认证（401xx）
        "403":
          $ref: "#/components/responses/Forbidden"
          description: 无权限（403xx）
      security:
        - bearerAuth: []
    post:
      summary: 注册 OAuth 客户端
      deprecated: false
      description: 需 admin 角色。第一方应用不返回 client_secret。
      operationId: adminCreateOAuthClient
      tags:
        - Admin
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - client_name
                - client_type
                - redirect_uris
                - grant_types
                - scopes
              properties:
                client_name:
                  type: string
                  description: 应用名称
                  example: 新应用
                client_type:
                  $ref: "#/components/schemas/ClientType"
                redirect_uris:
                  type: array
                  items:
                    type: string
                    format: uri
                  minItems: 1
                  description: 允许的回调地址列表
                  example:
                    - https://app.example.com/callback
                grant_types:
                  type: array
                  items:
                    type: string
                    enum:
                      - authorization_code
                      - refresh_token
                  minItems: 1
                  description: 授权模式
                  example:
                    - authorization_code
                    - refresh_token
                scopes:
                  type: array
                  items:
                    type: string
                  description: 授权范围
                  example:
                    - openid
                    - profile
        required: true
      responses:
        "201":
          description: 客户端创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClientCreateResponse"
          headers: {}
        "400":
          description: |
            校验失败（40000）。包括：`redirect_uris` 违反注册规则（非 https 且非
            loopback、含 fragment 或 userinfo、非绝对 URI、含首尾空白、超过 10 条、
            单条超 2048 字符、重复）；`grant_types` 含不支持的值或缺少
            `authorization_code`；`scopes` 为空、缺少 `openid` 或含不支持的值；
            `client_type` 非法；请求体传入 `client_id` / `client_secret` / `id`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardEnvelope"
          headers: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
          description: 未认证（401xx）
        "403":
          $ref: "#/components/responses/Forbidden"
          description: 无权限（403xx）
        "500":
          description: |
            服务器内部错误（50000）。`client_id` 由服务端以 16 随机字节生成，因此
            唯一键冲突不是调用方可修正的冲突，不返回 409：要么是不会复现的碰撞，
            要么是真实故障，两种情况下管理员都应重试而非改名。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardEnvelope"
          headers: {}
      security:
        - bearerAuth: []
  /admin/oauth-clients/{id}:
    put:
      summary: 更新 OAuth 客户端
      deprecated: false
      description: 需 admin 角色。
      operationId: adminUpdateOAuthClient
      tags:
        - Admin
      parameters:
        - name: id
          in: path
          description: 客户端内部 ID
          required: true
          example: 0
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client_name:
                  type: string
                  description: 应用名称
                redirect_uris:
                  type: array
                  items:
                    type: string
                    format: uri
                  description: 回调地址列表
                grant_types:
                  type: array
                  items:
                    type: string
                    enum:
                      - authorization_code
                      - refresh_token
                  description: 授权模式（必须包含 authorization_code）
                scopes:
                  type: array
                  items:
                    $ref: "#/components/schemas/OAuthScope"
                  description: |
                    授权范围，必须包含 openid 且仅含受支持的值。
                    只影响之后的授权请求，不回溯已签发的 token。
                is_active:
                  type: boolean
                  description: 是否启用
        required: true
      responses:
        "200":
          description: |
            更新成功。停用客户端（`is_active` 由 true 改为 false）会在同一事务内
            撤销该客户端的全部活跃 token。grant_types / scopes 的更新不触发 token
            撤销，只影响之后的授权与 token 请求。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          headers: {}
        "400":
          description: |
            校验失败（40000）：请求体为空（未提交任何可更新字段）、未知字段
            （client_id / client_secret / client_type / id）、`redirect_uris` 违反
            注册规则（与创建时同一套校验）、`grant_types` 含不支持的值或缺少
            `authorization_code`、`scopes` 缺少 openid 或含不支持的值。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardEnvelope"
          headers: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
          description: 未认证（401xx）
        "403":
          description: |
            无权限（403xx）。除角色不足外，还包括针对内置客户端
            （`INTERNAL_OAUTH_CLIENT_ID`，默认 `sast-link-web`）的受保护操作：
            停用它会使 `findInternalClient` 解析失败，令全站登录/刷新/注册立即中断
            且管理员自己也无法登录回来恢复，因此一律拒绝；改写它的 `redirect_uris`
            同样拒绝。改名允许。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardEnvelope"
          headers: {}
        "404":
          $ref: "#/components/responses/NotFound"
          description: 资源不存在（404xx）
      security:
        - bearerAuth: []
  /admin/audit-logs:
    get:
      summary: 查询审计日志
      deprecated: false
