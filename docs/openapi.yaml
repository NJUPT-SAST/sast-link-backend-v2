        "401":
          $ref: "#/components/responses/Unauthorized"
          description: 未认证（401xx）
        "403":
          $ref: "#/components/responses/Forbidden"
          description: 账号已注销（40301）
        "404":
          $ref: "#/components/responses/NotFound"
          description: >-
            设备不存在或不属于当前用户（40400）。空/空白的 id 也走这一条：
            handler 先 trim 再判断，区分 40000 与 40400 对调用方没有可确认的信息，
            反而可能帮助探测他人的会话，所以本端点不产生 40000。
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: 操作过于频繁（42900），60s 内最多 3 次，按用户限流
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: 设备服务暂不可用（50300，fail-closed：无法校验归属时不执行撤销）
      security:
        - bearerAuth: []
  /oauth/authorize:
    get:
      summary: 授权端点
      deprecated: false
      description: |
        授权流程的第一段，**无需认证**——从第三方跳转来的浏览器不携带 Authorization header。

        校验参数后将请求暂存 10 分钟，302 重定向至前端授权页
        `{OAUTH_CONSENT_URL}?request_id=ar_xxx&client_name=..&scope=..&expires_in=600`。
        用户决定由第二段 `POST /oauth/authorize/consent` 提交。

        使用 PKCE-S256，仅接受 code_challenge_method=S256。
        redirect_uri 必须与客户端注册值精确字符串相等，不做前缀匹配。

        错误分两条重定向路径：
        - client_id / redirect_uri 校验通过之前的错误（invalid_request、invalid_client）
          重定向至授权页，携带 error / error_description，不携带 state。
          RFC 6749 §4.1.2.1 禁止将错误重定向至未校验的 redirect_uri，否则本端点
          会退化为 open redirector。
        - 校验通过之后的错误（unsupported_response_type、invalid_scope、
          unauthorized_client、invalid_request）重定向至客户端 redirect_uri，
          携带 error / error_description / state。

        按调用方 IP 限流（默认 100 次/60s）：本端点无认证且每次调用写一个 Redis 暂存键。
      operationId: oauthAuthorize
      tags:
        - OAuth 2.1 Server
      parameters:
        - name: response_type
          in: query
          description: 固定值 `code`
          required: true
          schema:
            type: string
            enum:
              - code
        - name: client_id
          in: query
          description: 客户端标识
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          description: 回调地址
          required: true
          schema:
            type: string
            format: uri
        - name: scope
          in: query
          description: 授权范围，空格分隔（如 `openid profile`）。OAuth 线协议字段为单数 `scope`，数据库列保留 `scopes`
          required: true
          schema:
            type: string
        - name: state
          in: query
          description: CSRF 防护，客户端生成随机字符串，回调时原样返回
          required: true
          schema:
            type: string
        - name: code_challenge
          in: query
          description: PKCE code challenge
          required: true
          schema:
            type: string
        - name: code_challenge_method
          in: query
          description: PKCE 挑战方法，仅支持 S256
          required: true
          schema:
            type: string
            enum:
              - S256
        - name: nonce
          in: query
          description: OIDC nonce（可选参数）
          required: false
          schema:
            type: string
      responses:
        "302":
          description: >-
            成功时重定向至前端授权页，携带 request_id / client_name / scope /
            expires_in（暂存剩余秒数，供页面显示截止时间）。
            错误时按可重定向性重定向至授权页或客户端 redirect_uri，携带
            error / error_description。除参数校验类错误外，限流与 Redis 暂存失败
            会以 temporarily_unavailable、查库失败会以 server_error 重定向回授权页。
          headers:
            Location:
              description: 授权页或客户端回调地址
              schema:
                type: string
                format: uri
      security: []
  /oauth/authorize/consent:
    get:
      summary: 同意页元数据
      deprecated: false
      description: |
        返回 pending 授权请求的、服务端校验过的客户端元数据，供同意页渲染。
        SAST Link 自有端点，使用标准信封。

        同意页不应信任 consent URL 上的 client_name / scope —— 攻击者可构造
        指向同意页的链接，带自己的合法 request_id 却伪造可信应用名，诱导受害者
        同意给恶意应用 —— 应改从本端点读取。peek 不消费暂存，查看页面不烧请求。

        本端点按用户限流（RATE_LIMIT_CONSENT_INFO_RPM，默认 60/min），而非 IP：
        校园共享一个 NAT 出口 IP，按 IP 限流会被单个学生耗尽全校配额。
      operationId: oauthAuthorizeConsentInfo
      tags:
        - OAuth 2.1 Server
      parameters:
        - name: request_id
          in: query
          description: GET /oauth/authorize 重定向携带的暂存标识
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 服务端校验过的客户端元数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          client_name:
                            type: string
                            description: 应用名（来自暂存，URL 无法覆盖）
                          scopes:
                            type: array
                            items:
                              $ref: "#/components/schemas/OAuthScope"
                            description: 该授权请求申请的 scope
                          expires_in:
                            type: integer
                            description: 暂存剩余秒数
          headers: {}
        "400":
          description: request_id 缺失、无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardEnvelope"
          headers: {}
        "401":
          description: 未登录或 Access Token 无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardEnvelope"
          headers: {}
        "403":
          description: 账号已注销
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardEnvelope"
          headers: {}
        "429":
          description: 请求过于频繁（按用户限流）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardEnvelope"
          headers: {}
        "503":
          description: Redis 暂存不可读（fail-closed）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardEnvelope"
          headers: {}
      security:
        - bearerAuth: []
    post:
      summary: 授权确认
      deprecated: false
      description: |
        授权流程的第二段。SAST Link 自有端点而非 RFC 定义端点，因此使用标准响应信封。

        用户身份取自校验过的 access token，不从请求体读取。授权码的
        client / scope / PKCE challenge / nonce 全部取自暂存内容，不采信请求体回传值——
        否则调用方可以确认一个请求而为另一个客户端或另一组 scope 签发授权码。

        暂存内容以 Redis GetDel 原子消费，一个 request_id 最多产出一个授权码；
        并发重复提交只有一个成功。

        approve=false 同样返回 200 与一个 redirect_uri，其中携带
        error=access_denied 与原始 state（RFC 6749 §4.1.2.1 要求把拒绝告知客户端）。

        返回 JSON 而非 302，因为调用方是授权页自身的 fetch——302 会被 fetch 跟随，
        浏览器不会跳转。
      operationId: oauthAuthorizeConsent
      tags:
        - OAuth 2.1 Server
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - request_id
                - approve
              properties:
                request_id:
                  type: string
                  description: GET /oauth/authorize 重定向携带的暂存标识
                  example: ar_3f2a1b4c5d6e7f8a9b0c1d2e3f4a5b6c
                approve:
                  type: boolean
                  description: 用户决定。字段缺失返回 40000，不默认为拒绝
                  example: true
        required: true
      responses:
        "200":
          description: 授权决定已记录，返回浏览器应跳转的地址
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          redirect_uri:
                            type: string
                            format: uri
                            example: https://app.example.com/callback?code=ac_abc123&state=xyz
          headers: {}
        "400":
          description: request_id / approve 缺失、未知字段、暂存已过期或已消费
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardEnvelope"
          headers: {}
        "401":
          description: 未登录或 Access Token 无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardEnvelope"
          headers: {}
        "403":
          description: 账号已注销
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardEnvelope"
          headers: {}
        "404":
          description: 两段之间客户端被停用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardEnvelope"
          headers: {}
        "503":
          description: Redis 暂存不可读（fail-closed）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardEnvelope"
          headers: {}
      security:
        - bearerAuth: []
  /oauth/token:
    post:
      summary: Token 端点
      deprecated: false
      description: |
        支持 grant_type: `authorization_code` 和 `refresh_token`。
        第一方应用使用 PKCE 无需 client_secret，第三方应用需提供 client_secret。
        此端点不遵循标准响应信封，请求体必须使用 application/x-www-form-urlencoded，成功和错误均使用 RFC 6749 格式。
        scope 包含 `openid` 时，响应额外返回 `id_token`（EdDSA / Ed25519 签名 JWT）。
      operationId: oauthToken
      tags:
        - OAuth 2.1 Server
      parameters: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OAuthTokenRequest"
            examples:
              auth_code_first_party:
                value:
                  grant_type: authorization_code
                  code: auth_code_abc123...
                  redirect_uri: https://app.example.com/callback
                  client_id: 9f3a1c7d2e5b40a8c6d1f4b7a2e9c3d5
                  code_verifier: pkce_verifier_raw_string...
                summary: 第一方应用 - 授权码模式
              auth_code_third_party:
                value:
                  grant_type: authorization_code
                  code: auth_code_abc123...
                  redirect_uri: https://app.example.com/callback
                  client_id: 9f3a1c7d2e5b40a8c6d1f4b7a2e9c3d5
                  client_secret: 3K7mDzX434GbFm9YAePJ9FXQNjT6MF0U
                  code_verifier: pkce_verifier_raw_string...
                summary: 第三方应用 - 授权码模式
              refresh_token_first_party:
                value:
                  grant_type: refresh_token
                  refresh_token: rt_abc123...
                  client_id: 9f3a1c7d2e5b40a8c6d1f4b7a2e9c3d5
                summary: 第一方应用 - 刷新 Token
              refresh_token_third_party:
                value:
                  grant_type: refresh_token
                  refresh_token: rt_abc123...
                  client_id: 9f3a1c7d2e5b40a8c6d1f4b7a2e9c3d5
                  client_secret: 3K7mDzX434GbFm9YAePJ9FXQNjT6MF0U
                summary: 第三方应用 - 刷新 Token
        required: true
      responses:
        "200":
          description: Token 签发成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenResponse"
          headers: {}
        "400":
          description: |
            OAuth 错误（RFC 6749 格式）：invalid_request / invalid_grant /
            unsupported_grant_type / unauthorized_client。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
          headers: {}
        "401":
          description: |
            `invalid_client` —— 客户端认证失败。RFC 6749 §5.2 单独规定此项为 401，
            其余皆为 400。不携带 `WWW-Authenticate`：本服务只从表单体读取
            `client_secret`（discovery 通告 `none` 与 `client_secret_post`），
            通告一个未实现的认证方案会让客户端反复用 Basic 重试并始终失败。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
          headers: {}
        "429":
          description: |
            `temporarily_unavailable` —— 按调用方 IP 限流
            （`RATE_LIMIT_TOKEN_RPM`，默认 100 次/60s），附带 `Retry-After`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
          headers: {}
        "500":
          description: "`server_error` —— 服务器内部错误"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
          headers: {}
      security: []
  /oauth/revoke:
    post:
      summary: Token 撤销
      deprecated: false
      description: |
        撤销整条 token family。请求体必须使用 application/x-www-form-urlencoded。
        遵循 RFC 7009，成功固定返回 200 OK 且响应体为空。
      operationId: oauthRevokeToken
      tags:
        - OAuth 2.1 Server
      parameters: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - token
                - client_id
              properties:
                token:
                  type: string
                  description: 待撤销的 token
                  example: rt_abc123...
                token_type_hint:
                  type: string
                  enum:
                    - access_token
                    - refresh_token
                  description: Token 类型提示
                client_id:
                  type: string
                  description: 客户端标识
                client_secret:
                  type: string
                  description: |
                    机密客户端（`third_party`）必填；公开客户端不得携带，
                    携带则返回 `invalid_client`。
        required: true
      responses:
        "200":
          description: |
            撤销成功，RFC 7009 要求返回 200 OK 且响应体为空。未知 token 同样返回 200。
            注意：仅在撤销确实提交后才返回 200；撤销事务失败返回 500，
            以免客户端以为会话已终止而不再重试。
            撤销为 family 级：已过期的 access token 也会被解析并撤销其整条 family，
            因为它自身失效不代表同族 refresh token 失效（默认可存活 720h）。
            此时只放宽 exp 校验，签名 / kid / iss / aud / nbf 仍全部强制，
            归属以数据库行的 client_id 判定。
          headers: {}
        "400":
          description: OAuth 错误（RFC 6749 / RFC 7009 格式）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
          headers: {}
        "401":
          description: |
            `invalid_client` —— 客户端认证失败。不携带 `WWW-Authenticate`，
            理由同 `/oauth/token`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
          headers: {}
        "429":
          description: |
            `temporarily_unavailable` —— 与 `/oauth/token` 共用同一个按 IP 限流器，
            附带 `Retry-After`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
          headers: {}
        "500":
          description: "`server_error` —— 撤销事务失败，会话仍然有效，客户端应重试"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
          headers: {}
      security: []
  /oauth/grants:
    get:
      summary: 授权应用列表
      deprecated: false
      description: |
        返回当前用户授权过的应用列表（同意页点过同意的客户端），每个客户端一行，
        取最近一次授权记录（含 scopes 与授权时间）。客户端被停用仍会列出——
        用户需要看到「我授权过但已失效」的应用。SAST Link 自有端点，使用标准信封。
      operationId: oauthListGrants
      tags:
        - OAuth 2.1 Server
      parameters: []
      responses:
        "200":
          description: 授权应用列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          grants:
                            type: array
                            items:
                              $ref: "#/components/schemas/OAuthGrant"
          headers: {}
        "401":
          description: 未登录或 Access Token 无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardEnvelope"
          headers: {}
        "403":
          description: 账号已注销
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardEnvelope"
          headers: {}
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardEnvelope"
          headers: {}
      security:
        - bearerAuth: []
  /oauth/grants/{client_id}:
    delete:
      summary: 撤销一个应用的授权
      deprecated: false
      description: |
        撤销当前用户对该客户端的全部授权：先在独立事务中撤销该用户持有该客户端的
        全部活跃 Access / Refresh Token 并失效 auth-state 缓存，再删除授权历史，
        应用从已授权列表消失，下次使用必须重新走同意页。

        两步各为独立事务，token 撤销在前：删除授权历史失败时该应用的访问已被切断
        （fail-closed），只是列表可能仍显示它。撤销从未授权过的客户端同样返回 200
        （幂等）。审计 action 为 oauth_grant_revoke。
      operationId: oauthRevokeGrant
      tags:
        - OAuth 2.1 Server
      parameters:
        - name: client_id
          in: path
          description: 客户端主键（授权应用列表返回的 client_id，非对外标识 client_key）
          required: true
          example: 3
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: 已撤销该应用的授权
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: 已撤销该应用的授权
          headers: {}
        "400":
          description: client_id 非正整数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardEnvelope"
          headers: {}
        "401":
          description: 未登录或 Access Token 无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardEnvelope"
          headers: {}
        "403":
          description: 账号已注销
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardEnvelope"
          headers: {}
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardEnvelope"
          headers: {}
      security:
        - bearerAuth: []
