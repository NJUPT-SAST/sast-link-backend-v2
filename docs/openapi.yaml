  /user/identities/lark:
    post:
      summary: 绑定飞书
      deprecated: false
      description: >
        每个用户只能绑定一个飞书账号，每个飞书账号只能绑定一个用户。

        绑定与登录使用**不同的回调地址**，两条都要登记进飞书应用的重定向白名单。
        登录回调（`OAUTH_FEISHU_REDIRECT_URI`）指向本后端的
        `/oauth/lark/callback`；绑定回调是前端页面，由它拿到 provider code 后
        调用本接口。

        本接口不接受 `registration_state`：该值只证明有人完成了一次第三方回调，
        不证明是哪个 SAST 账号在操作，因此调用者一律由 Bearer token 认定。
      operationId: userBindLark
      tags:
        - Identities
      parameters:
        - name: code
          in: query
          description: 飞书 OAuth 授权码
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: false
          description: >
            签发该 code 时使用的回调地址（前端的绑定回调页）。RFC 6749 §4.1.3
            要求 token 交换重复这个值；飞书注册了多条回调时，不一致会以
            invalid_grant 拒绝。省略时回退到 OAUTH_FEISHU_REDIRECT_URI，仅在
            绑定与登录共用同一回调地址时适用。
          schema:
            type: string
            format: uri
      responses:
        "200":
          description: 绑定成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityBindResponse"
          headers: {}
        "409":
          $ref: "#/components/responses/Conflict"
          description: 资源冲突（409xx）
        "502":
          $ref: "#/components/responses/BadGateway"
      security:
        - bearerAuth: []
  /user/identities/github:
    post:
      summary: 绑定 GitHub
      deprecated: false
      description: >
        每个用户只能绑定一个 GitHub 账号，每个 GitHub 账号只能绑定一个用户。

        绑定回调与登录回调不同，但 GitHub OAuth App 只能注册一条 callback URL，
        且要求 host 与端口精确匹配、path 必须位于已注册路径之下。因此两条回调必须
        共享一个已注册的父路径：生产上绑定页放在 /v2/oauth/bind/github，与登录回调
        同处 /v2/oauth 之下并注册该前缀；本地利用 loopback 免端口匹配的例外注册
        http://127.0.0.1/oauth。详见 docs/runbooks/caddy-reverse-proxy.md。

        为绑定单独开一个 OAuth App 行不通：Bind() 用 OAUTH_GITHUB_CLIENT_ID/SECRET
        交换 code，另一个 App 签发的 code 会被拒绝。

        本接口不接受 `registration_state`，调用者一律由 Bearer token 认定。
      operationId: userBindGithub
      tags:
        - Identities
      parameters:
        - name: code
          in: query
          description: GitHub OAuth 授权码
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: false
          description: >
            签发该 code 时使用的回调地址（前端的绑定回调页）。GitHub 在 token
            交换阶段用它校验与签发 code 时是否一致。省略时回退到
            OAUTH_GITHUB_REDIRECT_URI。
          schema:
            type: string
            format: uri
      responses:
        "200":
          description: 绑定成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityBindResponse"
          headers: {}
        "409":
          $ref: "#/components/responses/Conflict"
          description: 资源冲突（409xx）
        "502":
          $ref: "#/components/responses/BadGateway"
      security:
        - bearerAuth: []
