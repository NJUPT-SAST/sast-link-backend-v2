                $ref: "#/components/schemas/OAuthError"
          headers:
            WWW-Authenticate:
              description: >-
                RFC 6750 §3 Bearer 挑战头。符合规范的 OIDC 客户端读取此 header
                判断是否需要刷新 token。
              schema:
                type: string
                example: 'Bearer realm="sast-link", error="invalid_token"'
      security:
        - bearerAuth: []
