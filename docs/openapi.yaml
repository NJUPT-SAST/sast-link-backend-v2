    OAuthError:
      type: object
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - unsupported_grant_type
            - unsupported_response_type
            - invalid_scope
            - access_denied
            - invalid_token
            - temporarily_unavailable
            - server_error
          description: >-
            RFC 6749 §4.1.2.1 / §5.2、RFC 6750 §3.1 错误代码。
            invalid_client 对应 401，但**不附带** WWW-Authenticate（本服务只从表单体
            读取 client_secret，通告未实现的 Basic 方案会让客户端反复重试并始终失败）；
            invalid_token 仅出现在 /userinfo，附带 Bearer 挑战头；
            temporarily_unavailable 用于限流（429）与依赖不可用（503）。
        error_description:
          type: string
          description: 错误描述
    # === 通用响应信封（标准端点） ===
    # 所有标准端点使用 { code: int, message: string, data: object|array|null } 响应信封。
    # 以下 StandardEnvelope 为通用模板，各端点的 data schema 在内嵌中各自定义。
    #
    # 不使用信封的例外：
    #   - /oauth/authorize → 成功/错误均为 redirect response，query 携带 request_id 或 error/error_description
    #   - /oauth/token → application/x-www-form-urlencoded 请求；成功/错误均为 OAuth JSON，字段名使用 scope（单数）；
    #     成功响应携带 Cache-Control: no-store 与 Pragma: no-cache（RFC 6749 §5.1）
    #   - /oauth/revoke → application/x-www-form-urlencoded 请求；RFC 7009 成功为 200 空响应体，错误为 OAuth JSON
    #
    # 使用信封的 OAuth 端点：
    #   - /oauth/authorize/consent → SAST Link 自有端点而非 RFC 定义端点，沿用标准信封
    #   - /userinfo → 成功为 OIDC UserInfo claims；错误为 RFC 6750 Bearer Token 格式
    #   - /health → 直接 {status, db, redis}
    #   - /card/{id} → 已下线（隐私重设计中），暂不响应
    #   - /.well-known/openid-configuration → OIDC Discovery JSON
    #   - /.well-known/jwks.json → JWKS JSON
    StandardEnvelope:
      type: object
      description: SAST Link v2 标准响应信封模板
      properties:
        code:
          type: integer
          description: 业务状态码，0 表示成功，非 0 表示错误
          example: 0
        message:
          type: string
          description: 可读的描述信息，成功时为 "ok"
          example: ok
        data:
          description: 业务数据载荷，错误时为 null
    # === 具体响应 schema ===
    SendCodeResponse:
      type: object
      description: 发送验证码响应
      properties:
        code:
          type: integer
          description: 业务状态码，0 表示成功
          example: 0
