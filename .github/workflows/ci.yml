name: CI

on:
  pull_request:
    branches: [main]
  # main is also built and tested after the merge, not only on pull requests: two
  # PRs green in isolation can still break main together, and a push to main
  # deploys and migrates — the first notice would otherwise be production traffic.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keyed by ref, so a pull-request run and the post-merge main run never cancel
# each other; cancel-in-progress stays on (a same-branch push supersedes its
# predecessor, and the deploy workflow has its own serial group).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No GO_VERSION: every setup-go below reads go-version-file: go.mod, so the
# toolchain is declared once. The Dockerfile's golang base image is the one copy
# that cannot, and the toolchain job below fails when it disagrees.

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  test:
    name: test
    runs-on: ubuntu-latest
    # Wider than the go test -timeout below: with the two close, the runner kills
    # the step and the panic dump that names the stuck test never gets written.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        # -pgo=off: the test build must not pick up cmd/api/default.pgo (PGO +
        # -race/-cover on the same package is a known linker "fingerprint
        # mismatch" flake; tests don't need profile-guided optimization).
        #
        # -timeout 25m: integration suites provision a PostgreSQL container per
        # test through Testcontainers and already exceed go test's 10-minute
        # default, whose failure reads as a hung test (no `--- FAIL` line).
        run: go test -race -shuffle=on -pgo=off -timeout 25m -coverprofile=coverage.out -covermode=atomic ./...

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          go build -v -o bin/api ./cmd/api
          go build -v -o bin/migrate ./cmd/migrate

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # actionlint checks the workflow schema and shells out to shellcheck for
      # every `run:` block — the part that matters, since deploy.yml's ~130 shell
      # lines run on the production server over SSH, where a typo surfaces as a
      # half-finished deploy. The deploy script is POSIX sh (the login shell is not
      # guaranteed bash), so no pipeline may rely on pipefail. Pinned by version:
      # a new actionlint release would otherwise fail unrelated pull requests.
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  toolchain:
    name: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # go.mod is the single source of truth; the Dockerfile's build stage is the
      # one copy that cannot read it, so this job fails when they disagree — a
      # mismatch means CI tests one toolchain and production runs another, and a
      # Go release changing codegen or standard-library behaviour would slip
      # through green tests.
      - name: Dockerfile golang base matches go.mod
        run: |
          go_mod_version=$(awk '/^go / { print $2 }' go.mod)
          dockerfile_version=$(sed -n 's/^FROM golang:\([0-9.]*\)-.*/\1/p' Dockerfile | head -1)
          test -n "${go_mod_version}" || { echo "::error::no go directive in go.mod"; exit 1; }
          test -n "${dockerfile_version}" || { echo "::error::no golang base image in Dockerfile"; exit 1; }
          echo "go.mod: ${go_mod_version}"
          echo "Dockerfile: ${dockerfile_version}"
          test "${go_mod_version}" = "${dockerfile_version}" || {
            echo "::error::toolchain mismatch: go.mod asks for ${go_mod_version}, Dockerfile builds with ${dockerfile_version}"
            exit 1; }
