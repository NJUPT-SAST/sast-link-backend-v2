name: CI

on:
  pull_request:
    branches: [main]
  # main is also built and tested after the merge, not only on pull requests: two
  # PRs green in isolation can still break main together, and a push to main
  # deploys and migrates — the first notice would otherwise be production traffic.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keyed by ref, so a pull-request run and the post-merge main run never cancel
# each other; cancel-in-progress stays on (a same-branch push supersedes its
# predecessor, and the deploy workflow has its own serial group).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No GO_VERSION: every setup-go below reads go-version-file: go.mod, so the
# toolchain is declared once. The Dockerfile's golang base image is the one copy
# that cannot, and the toolchain job below fails when it disagrees.

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  # OpenAPI contract lint against the redocly recommended ruleset. Runs only on
  # PRs (and main pushes) that touch docs/openapi.yaml: the current contract does
  # not yet pass every recommended rule (no `servers:` declared, out-of-order
  # schema properties), so an unconditional gate would fail PRs that never edit
  # the contract until those are cleared. Gating on the file itself keeps
  # unrelated PRs green while every contract edit is validated.
  openapi:
    name: openapi lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The change probe below diffs against the change's base commit.
          fetch-depth: 0

      - name: Detect docs/openapi.yaml changes
        id: changed
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
            # A new branch's first push carries an all-zero before; diffing
            # against it is fatal, so fall back to the parent commit (or, at the
            # root commit, to HEAD itself — an empty diff, conservatively skipped).
            if [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
              base="$(git rev-parse HEAD^ 2>/dev/null || echo "${{ github.sha }}")"
            fi
          else
            base="HEAD~1"
          fi
          if git diff --name-only "$base" HEAD | grep -qx 'docs/openapi.yaml'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.changed.outputs.changed == 'true'
        with:
          node-version: 22

      - name: Lint OpenAPI contract
        if: steps.changed.outputs.changed == 'true'
        run: npx --yes @redocly/cli@1.34.19 lint docs/openapi.yaml

  # The test suite is split in two parallel jobs: packages whose tests start
  # Testcontainers (internal/testutil importers) and packages that run without
  # external services. The integration batch provisions a PostgreSQL 16 and a
  # Redis container per package, which dominates the wall time; unit tests no
  # longer wait behind it. The batch partition is computed by a shared script,
  # not hardcoded here, and asserted by test-split below. Both jobs keep
  # -race -shuffle=on -covermode=atomic, so the split only changes what runs
  # in parallel, never how a package is tested.
  test-unit:
    name: test (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        # -pgo=off: the test build must not pick up cmd/api/default.pgo. PGO +
        # -race/-cover on the same package is a known source of linker
        # "fingerprint mismatch" flake; tests don't need profile-guided
        # optimization (it only shapes the production binary).
        run: |
          # The substitution must split: go test takes one package per argument.
          # shellcheck disable=SC2046
          go test -race -shuffle=on -pgo=off -coverprofile=coverage-unit.out -covermode=atomic $(bash scripts/split-test-packages.sh unit)

      - name: Upload unit coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage-unit.out
          if-no-files-found: error

  test-integration:
    name: test (integration)
    runs-on: ubuntu-latest
    # Wider than the go test -timeout below: with the two close, the runner kills
    # the step and the panic dump that names the stuck test never gets written.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run integration tests
        # -pgo=off: the test build must not pick up cmd/api/default.pgo. PGO +
        # -race/-cover on the same package is a known source of linker
        # "fingerprint mismatch" flake; tests don't need profile-guided
        # optimization (it only shapes the production binary).
        #
        # -timeout 25m raises go test's per-package default of 10 minutes.
        # internal/repository shares one PostgreSQL container with a dedicated
        # schema per test (internal/testutil/postgres.go) and is already past
        # that default on a developer machine;
        # the integration suites in internal/migration and the handler packages
        # are the same shape. A default-timeout failure is especially misleading
        # here: the panic reports "test timed out" with no `--- FAIL` line, so it
        # reads as a hung test rather than as a package that needed more wall
        # clock than Go allows by default.
        #
        # This is a ceiling, not a budget. If a package genuinely deadlocks, the
        # dump still arrives — 15 minutes later than before, but with the
        # goroutine trace that identifies it.
        run: |
          # The substitution must split: go test takes one package per argument.
          # shellcheck disable=SC2046
          go test -race -shuffle=on -pgo=off -timeout 25m -coverprofile=coverage-integration.out -covermode=atomic $(bash scripts/split-test-packages.sh integration)

      - name: Upload integration coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: coverage-integration.out
          if-no-files-found: error

  # Aggregation gate. The check name stays `test`, so branch protection keeps
  # working unchanged; deploy.yml gates on the whole run's conclusion, which
  # this job participates in, so nothing there moves either.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test-unit, test-integration]
    steps:
      - run: echo "unit and integration tests passed"

  # Coverage aggregation for human inspection (a PR's own coverage surface, not a
  # gate). The two batches partition ./... exactly — asserted by test-split below —
  # and each package's profile records only its own source files, so no file is
  # covered twice and concatenating the two profiles (keeping the first file's
  # `mode:` header) is a correct merge, not a lossy approximation.
  coverage-merge:
    name: merge coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test-unit, test-integration]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: coverage-unit
          path: coverage-unit
      - uses: actions/download-artifact@v8
        with:
          name: coverage-integration
          path: coverage-integration

      - name: Merge coverage profiles
        run: |
          set -euo pipefail
          head -1 coverage-unit/coverage-unit.out > coverage-merged.out
          tail -n +2 coverage-unit/coverage-unit.out >> coverage-merged.out
          tail -n +2 coverage-integration/coverage-integration.out >> coverage-merged.out

      - name: Upload merged coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-merged
          path: coverage-merged.out
          if-no-files-found: error

  # Asserts the two batches partition ./... exactly: nothing missed (a package
  # would silently stop being tested) and nothing duplicated (a package's
  # coverage counters would be double-counted if the profiles were ever
  # merged). Cheap enough to run as its own job; a failure means the shared
  # script needs attention, not the test suites.
  test-split:
    name: test-split
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit and integration packages partition ./...
        run: |
          set -euo pipefail
          unit=$(bash scripts/split-test-packages.sh unit | sort)
          integration=$(bash scripts/split-test-packages.sh integration | sort)
          all=$(go list ./... | sort)
          missing=$(comm -23 <(printf '%s\n' "$all") <(printf '%s\n%s\n' "$unit" "$integration" | sort -u))
          duplicated=$(comm -12 <(printf '%s\n' "$unit") <(printf '%s\n' "$integration"))
          test -z "$missing" || { echo "::error::packages missed by the split: $missing"; exit 1; }
          test -z "$duplicated" || { echo "::error::packages in both batches: $duplicated"; exit 1; }
          echo "unit=$(echo "$unit" | wc -l), integration=$(echo "$integration" | wc -l), total=$(echo "$all" | wc -l)"

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          go build -v -o bin/api ./cmd/api
          go build -v -o bin/migrate ./cmd/migrate

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # actionlint checks the workflow schema and shells out to shellcheck for
      # every `run:` block — the part that matters, since deploy.yml's ~130 shell
      # lines run on the production server over SSH, where a typo surfaces as a
      # half-finished deploy. The deploy script is POSIX sh (the login shell is not
      # guaranteed bash), so no pipeline may rely on pipefail. Pinned by version:
      # a new actionlint release would otherwise fail unrelated pull requests.
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  toolchain:
    name: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # go.mod is the single source of truth; the Dockerfile's build stage is the
      # one copy that cannot read it, so this job fails when they disagree — a
      # mismatch means CI tests one toolchain and production runs another, and a
      # Go release changing codegen or standard-library behaviour would slip
      # through green tests.
      - name: Dockerfile golang base matches go.mod
        run: |
          go_mod_version=$(awk '/^go / { print $2 }' go.mod)
          dockerfile_version=$(sed -n 's/^FROM golang:\([0-9.]*\)-.*/\1/p' Dockerfile | head -1)
          test -n "${go_mod_version}" || { echo "::error::no go directive in go.mod"; exit 1; }
          test -n "${dockerfile_version}" || { echo "::error::no golang base image in Dockerfile"; exit 1; }
          echo "go.mod: ${go_mod_version}"
          echo "Dockerfile: ${dockerfile_version}"
          test "${go_mod_version}" = "${dockerfile_version}" || {
            echo "::error::toolchain mismatch: go.mod asks for ${go_mod_version}, Dockerfile builds with ${dockerfile_version}"
            exit 1; }
