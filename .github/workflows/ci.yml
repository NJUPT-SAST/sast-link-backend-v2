name: CI

on:
  pull_request:
    branches: [main]
  # main is also built and tested after the merge, not only on the pull request.
  # Two pull requests can each be green in isolation and still break main
  # together — a rename that lands beside a new caller, a repository method whose
  # contract one branch tightened while another added a user of the old shape.
  # Git merges those cleanly, so no textual conflict appears and no PR run ever
  # sees the combination. Since a push to main deploys and now also migrates, the
  # first thing to notice the breakage would otherwise be production traffic.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keyed by ref, so a pull-request run and the post-merge main run never cancel
# each other. cancel-in-progress stays on: superseding a push to the same branch
# is the intended behaviour, and the deploy workflow has its own serial group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No GO_VERSION here on purpose. Every setup-go below reads go-version-file:
# go.mod, so the toolchain is declared once, in the file the compiler itself
# obeys. A hardcoded copy per workflow drifts silently: CI would keep testing
# against the old toolchain while go.mod asked for a newer one, and nothing would
# report it. The Dockerfile's golang base image is the one remaining copy, and
# the toolchain job below fails when it disagrees.

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  # The test suite is split in two parallel jobs: packages whose tests start
  # Testcontainers (internal/testutil importers) and packages that run without
  # external services. The integration batch provisions a PostgreSQL 16 and a
  # Redis container per package, which dominates the wall time; unit tests no
  # longer wait behind it. The batch partition is computed by a shared script,
  # not hardcoded here, and asserted by test-split below. Both jobs keep
  # -race -shuffle=on -covermode=atomic, so the split only changes what runs
  # in parallel, never how a package is tested.
  test-unit:
    name: test (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        # -pgo=off: the test build must not pick up cmd/api/default.pgo. PGO +
        # -race/-cover on the same package is a known source of linker
        # "fingerprint mismatch" flake; tests don't need profile-guided
        # optimization (it only shapes the production binary).
        run: |
          # The substitution must split: go test takes one package per argument.
          # shellcheck disable=SC2046
          go test -race -shuffle=on -pgo=off -coverprofile=coverage-unit.out -covermode=atomic $(bash scripts/split-test-packages.sh unit)

  test-integration:
    name: test (integration)
    runs-on: ubuntu-latest
    # Wider than the go test -timeout below, so the job's own ceiling is not what
    # kills a run that is merely slow. When the two are close, a timeout gives no
    # test output at all — the runner cancels the step and the panic dump that
    # names the stuck test never gets written.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run integration tests
        # -pgo=off: the test build must not pick up cmd/api/default.pgo. PGO +
        # -race/-cover on the same package is a known source of linker
        # "fingerprint mismatch" flake; tests don't need profile-guided
        # optimization (it only shapes the production binary).
        #
        # -timeout 25m raises go test's per-package default of 10 minutes.
        # internal/repository provisions a PostgreSQL container per test through
        # Testcontainers and is already past that default on a developer machine;
        # the integration suites in internal/migration and the handler packages
        # are the same shape. A default-timeout failure is especially misleading
        # here: the panic reports "test timed out" with no `--- FAIL` line, so it
        # reads as a hung test rather than as a package that needed more wall
        # clock than Go allows by default.
        #
        # This is a ceiling, not a budget. If a package genuinely deadlocks, the
        # dump still arrives — 15 minutes later than before, but with the
        # goroutine trace that identifies it.
        run: |
          # The substitution must split: go test takes one package per argument.
          # shellcheck disable=SC2046
          go test -race -shuffle=on -pgo=off -timeout 25m -coverprofile=coverage-integration.out -covermode=atomic $(bash scripts/split-test-packages.sh integration)

  # Aggregation gate. The check name stays `test`, so branch protection keeps
  # working unchanged; deploy.yml gates on the whole run's conclusion, which
  # this job participates in, so nothing there moves either.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test-unit, test-integration]
    steps:
      - run: echo "unit and integration tests passed"

  # Asserts the two batches partition ./... exactly: nothing missed (a package
  # would silently stop being tested) and nothing duplicated (a package's
  # coverage counters would be double-counted if the profiles were ever
  # merged). Cheap enough to run as its own job; a failure means the shared
  # script needs attention, not the test suites.
  test-split:
    name: test-split
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit and integration packages partition ./...
        run: |
          set -euo pipefail
          unit=$(bash scripts/split-test-packages.sh unit | sort)
          integration=$(bash scripts/split-test-packages.sh integration | sort)
          all=$(go list ./... | sort)
          missing=$(comm -23 <(printf '%s\n' "$all") <(printf '%s\n%s\n' "$unit" "$integration" | sort -u))
          duplicated=$(comm -12 <(printf '%s\n' "$unit") <(printf '%s\n' "$integration"))
          test -z "$missing" || { echo "::error::packages missed by the split: $missing"; exit 1; }
          test -z "$duplicated" || { echo "::error::packages in both batches: $duplicated"; exit 1; }
          echo "unit=$(echo "$unit" | wc -l), integration=$(echo "$integration" | wc -l), total=$(echo "$all" | wc -l)"

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          go build -v -o bin/api ./cmd/api
          go build -v -o bin/migrate ./cmd/migrate

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # deploy.yml carries ~130 lines of shell that runs on the production server
      # over SSH, where a typo is discovered by a half-finished deploy rather than
      # by a failing job. actionlint checks the workflow schema and expression
      # syntax, and shells out to shellcheck for every `run:` block, which is the
      # part that matters here: the deploy script is POSIX sh (the deploy user's
      # login shell is not guaranteed to be bash), so it cannot rely on pipefail
      # and every pipeline has to be guarded explicitly.
      #
      # Pinned by version rather than @latest: a new actionlint release adding a
      # rule would otherwise fail unrelated pull requests with no change on our
      # side. shellcheck is preinstalled on ubuntu-latest runners.
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  toolchain:
    name: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # go.mod is the single source of truth for the toolchain: the workflows read
      # it through go-version-file, and this job holds the one copy that cannot,
      # the Dockerfile's build stage. They have to agree, because the Dockerfile
      # is what actually compiles the deployed binaries — a mismatch means CI
      # tested one toolchain and production runs another, and a Go release that
      # changes codegen or standard-library behaviour would slip through green
      # tests. Dependabot's docker updates land the base-image bump on its own, so
      # this check is what forces go.mod to move with it.
      - name: Dockerfile golang base matches go.mod
        run: |
          go_mod_version=$(awk '/^go / { print $2 }' go.mod)
          dockerfile_version=$(sed -n 's/^FROM golang:\([0-9.]*\)-.*/\1/p' Dockerfile | head -1)
          test -n "${go_mod_version}" || { echo "::error::no go directive in go.mod"; exit 1; }
          test -n "${dockerfile_version}" || { echo "::error::no golang base image in Dockerfile"; exit 1; }
          echo "go.mod: ${go_mod_version}"
          echo "Dockerfile: ${dockerfile_version}"
          test "${go_mod_version}" = "${dockerfile_version}" || {
            echo "::error::toolchain mismatch: go.mod asks for ${go_mod_version}, Dockerfile builds with ${dockerfile_version}"
            exit 1; }
