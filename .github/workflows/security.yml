name: Security

on:
  # govulncheck also gates pull requests (see its job below); the weekly run
  # catches advisories on dependencies the repository has not touched since.
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No GO_VERSION: setup-go reads go-version-file: go.mod below, so the toolchain
  # is declared once. See ci.yml's toolchain job for the Dockerfile side.
  GOVULNCHECK_VERSION: "v1.6.0"

jobs:
  gosec:
    name: gosec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scheduled and manual only: gosec is a periodic whole-module sweep whose
    # findings are often judgement calls, so it does not gate merges; govulncheck
    # below is the one that does.
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -fmt text ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs on pull requests too: a vulnerable dependency bump would otherwise sit
    # in production until the Monday sweep, and a push to main deploys immediately.
    # govulncheck reports only reachable vulnerabilities, so it can gate merges.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: Run govulncheck
        run: govulncheck ./...
