name: Security

on:
  # govulncheck also gates pull requests (see the job's own comment). The weekly
  # run stays, because it is the only thing that catches an advisory published
  # against a dependency the repository has not touched since.
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No GO_VERSION: setup-go reads go-version-file: go.mod below, so the toolchain
  # is declared once. See ci.yml's toolchain job for the Dockerfile side.
  GOVULNCHECK_VERSION: "v1.6.0"

jobs:
  gosec:
    name: gosec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scheduled and manual only. gosec's value here is a periodic sweep of the
    # whole module, and its findings are style-adjacent often enough that making
    # it a merge gate would block pull requests on judgement calls rather than on
    # known-vulnerable code. govulncheck below is the one that gates.
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -fmt text ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs on pull requests too, not just weekly. A dependency bump that pulls in
    # a known-vulnerable version used to have a worst case of seven days in
    # production before the Monday sweep found it, and a push to main deploys
    # straight away. govulncheck reports only vulnerabilities reachable from this
    # module's own call graph, so it is specific enough to block a merge on.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: Run govulncheck
        run: govulncheck ./...
