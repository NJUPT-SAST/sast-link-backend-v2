repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple]
      - id: check-merge-conflict

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt

  - repo: local
    hooks:
      # Pin the tool and let Go manage its cache; no global goimports install.
      - id: go-imports
        name: go imports
        entry: go run golang.org/x/tools/cmd/goimports@v0.43.0 -w
        language: system
        types: [go]
        require_serial: true
      # This module has no Go package at its root. Vet all module packages,
      # rather than deriving package paths from a failing bare `go list`.
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false
        require_serial: true

  # Same linter the CI lint job runs (golangci/golangci-lint-action, also pinned
  # to v2.12.2), so a commit and CI read the same .golangci.yml with the same
  # version. The default hook lints only the change (--new-from-rev HEAD); swap
  # the id for golangci-lint-full to run the whole module exactly like CI does.
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint
